[project]
name = "edge-ai-surveillance"
version = "0.3.0"
description = "Giám sát và bám quỹ đạo mục tiêu bay bằng AI đa cảm biến tại thiết bị biên (chỉ hỗ trợ quyết định)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8", "pillow>=10.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "pre-commit>=3.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["edge_ai*"]

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
filterwarnings = [
    # cảnh báo của chính torch khi dùng norm_first=True, không phải lỗi của dự án
    "ignore:enable_nested_tensor is True:UserWarning",
]

# -------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["backend"]
extend-exclude = ["docs/build"]

[tool.ruff.lint]
# E/W: pycodestyle · F: pyflakes · I: thứ tự import · N: quy tắc đặt tên
# B: lỗi hay gặp · UP: cú pháp Python mới · SIM: đơn giản hoá
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM"]
ignore = [
    "E741",   # tên biến l/I/O — dùng có chủ đích trong công thức vật lý
    "N802", "N803", "N806",  # tên viết hoa theo ký hiệu toán học: H, P, R, Q, F, S, X
    "N816",   # hằng trộn hoa-thường như MD_TO_TARGET trong phạm vi hàm
    "B905",   # zip() không strict: các mảng ghép luôn cùng độ dài theo cấu trúc
    "SIM108", # if/else nhiều dòng dễ đọc hơn biểu thức ba ngôi trong mã vật lý
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dùng Depends()/Header() làm giá trị mặc định theo thiết kế
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.ruff.lint.isort]
known-first-party = ["edge_ai"]

[tool.ruff.lint.per-file-ignores]
# test: đặt bí danh ngắn kiểu hằng cho module (PL, EM, C) cho dễ đọc
"backend/tests/*" = ["E402", "N812"]

[tool.ruff.format]
quote-style = "double"
