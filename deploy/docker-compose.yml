# Triển khai riêng cho Edge AI: dashboard FastAPI + Caddy (HTTPS).
#
#   cp .env.example .env        # ở GỐC repo, đặt EDGE_API_TOKEN (bắt buộc), EDGE_DOMAIN
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
#   mở https://localhost  (localhost: chứng chỉ tự ký, trình duyệt sẽ cảnh báo)
#
# Cổng 8099 của app KHÔNG mở ra ngoài; chỉ Caddy (80/443) nhận kết nối.
name: edge-ai

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: edge-ai:latest
    restart: unless-stopped
    environment:
      # Qua Caddy, trình duyệt không phải loopback của container nên POST
      # luôn cần mã. Thiếu mã thì dừng ngay thay vì chạy một dashboard bấm
      # không được.
      EDGE_API_TOKEN: ${EDGE_API_TOKEN:?Đặt EDGE_API_TOKEN trong .env (xem .env.example)}
    volumes:
      - edge-audit:/var/lib/edge          # nhật ký quyết định chuỗi băm, giữ qua các lần khởi động lại
    expose:
      - "8099"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8099/api/health',timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
      - "${EDGE_HTTPS_PORT:-443}:443/udp"   # HTTP/3
    environment:
      EDGE_DOMAIN: ${EDGE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data                  # chứng chỉ + khoá CA nội bộ
      - caddy-config:/config

volumes:
  edge-audit:
  caddy-data:
  caddy-config:
