name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.17.6"
      - run: ruff check .
      - run: ruff format --check .

  audit:
    # Lỗ hổng đã biết trong các thư viện chạy trên trạm (SECURITY R-4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pip-audit==2.7.3"
      - run: bash deploy/audit-deps.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Đúng các phiên bản đã khoá (torch bản CPU), rồi thêm công cụ dev
      - run: >-
          pip install --require-hashes -r requirements.lock
          --index-url https://download.pytorch.org/whl/cpu
          --extra-index-url https://pypi.org/simple
      - run: pip install -e ".[dev,figures]"
      - run: python -m pytest

  e2e:
    # Trình duyệt thật bấm như người trực: TEST_PLAN mục 3 (E-1..E-10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: >-
          pip install --require-hashes -r requirements.lock
          --index-url https://download.pytorch.org/whl/cpu
          --extra-index-url https://pypi.org/simple
      - run: pip install -e ".[dev]" "playwright==1.65.2"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest backend/tests/e2e --basetemp=e2e-tmp
        env:
          EDGE_E2E: "1"
      - name: log máy chủ khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: e2e-tmp/**/server.log
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t edge-ai:ci .
      - name: smoke test container
        run: |
          docker run -d --name edge -p 8099:8099 -e EDGE_API_TOKEN=ci-only edge-ai:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8099/api/health && exit 0
            sleep 2
          done
          docker logs edge
          exit 1
